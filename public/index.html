<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat Stream Demo with ai-stream-typer</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151b2b;
      --accent: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #242e47;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .chat-container {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h2 { font-size: 18px; font-weight: 600; }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .messages {
      padding: 24px;
      min-height: 220px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--accent);
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: #242e47; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <h2>AI Chatbot Streaming Demo</h2>
      <span class="badge">npm: ai-stream-typer</span>
    </div>
    <div class="messages" id="chat">Click "Ask AI Assistant" below to trigger streaming...</div>
    <div class="footer">
      <button id="sendBtn">✨ Ask AI Assistant</button>
      <button id="flushBtn" class="secondary">⚡ Flush (Skip)</button>
    </div>
  </div>

  <script type="module">
    import { StreamTyper } from "/node_modules/ai-stream-typer/dist/index.js";

    const chat = document.getElementById("chat");
    const sendBtn = document.getElementById("sendBtn");
    const flushBtn = document.getElementById("flushBtn");

    let typer = null;
    let pendingTimeouts = [];
    let pendingChunks = [];

    const sampleChunks = [
      "Here is a quick summary: ",
      "Large Language Models generate text in chunks. ",
      "When network latency varies, reading can feel jittery.\n\n",
      "Using `ai-stream-typer` solves this by smoothing character output ",
      "at an adaptive rate with natural pauses on punctuation marks like periods and commas. 🚀"
    ];

    sendBtn.addEventListener("click", () => {
      // Clear any ongoing stream
      pendingTimeouts.forEach(clearTimeout);
      pendingTimeouts = [];

      chat.innerHTML = '<span id="text"></span><span class="cursor"></span>';
      const textSpan = document.getElementById("text");

      typer = new StreamTyper({
        minDelay: 15,
        maxDelay: 35,
        punctuationPause: 100,
        onText: (text) => {
          textSpan.textContent = text;
        },
        onComplete: () => {
          const cursor = document.querySelector(".cursor");
          if (cursor) cursor.remove();
        }
      });

      pendingChunks = [...sampleChunks];

      let delay = 0;
      sampleChunks.forEach((chunk, index) => {
        delay += Math.floor(Math.random() * 250) + 150;
        const tid = setTimeout(() => {
          // Remove this chunk from pending and feed into typer
          pendingChunks.shift();
          typer.feed(chunk);
          if (index === sampleChunks.length - 1) {
            typer.end();
          }
        }, delay);
        pendingTimeouts.push(tid);
      });
    });

    flushBtn.addEventListener("click", () => {
      if (!typer) return;

      // 1. Cancel remaining simulated network chunk delays
      pendingTimeouts.forEach(clearTimeout);
      pendingTimeouts = [];

      // 2. Feed all remaining pending chunks into typer immediately
      if (pendingChunks.length > 0) {
        typer.feed(pendingChunks.join(""));
        pendingChunks = [];
      }

      // 3. Signal stream end and flush all buffered characters instantly
      typer.end();
      typer.flush();

      // 4. Remove cursor
      const cursor = document.querySelector(".cursor");
      if (cursor) cursor.remove();
    });
  </script>
</body>
</html>
